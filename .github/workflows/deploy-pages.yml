name: Deploy GitHub Pages
run-name: "Pages - ${{ inputs.request_id || github.event_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional deployment tracking identifier
        required: false
        type: string
  # A bot GITHUB_TOKEN push does not trigger another push workflow.
  # These trusted workflows commit generated files; deploy current main after they finish.
  workflow_run:
    workflows: [Sync plugin configuration defaults, Refresh GitHub release snapshot]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.COREX_PAGES_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.event != 'pull_request_target'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the website default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Rebuild the offline configuration bundle
        run: node tools/build-config-bundle.mjs .
      - name: Rebuild the offline documentation bundle
        run: node tools/build-docs-bundle.mjs .
      - name: Build static search metadata
        run: node tools/build-page-meta.mjs .
      - name: Build the static privacy notice
        run: node tools/build-privacy-page.mjs .
      - name: Build canonical sitemap and robots reference
        run: node tools/build-sitemap.mjs .
      - name: Run Node regression tests
        run: node --test
      - name: Validate theme data and snapshots
        run: node tests/validate-theme.mjs
      - name: Prepare only public runtime files
        run: SITE_BUILD_COMMIT="$(git rev-parse HEAD)" node tools/prepare-pages.mjs .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
